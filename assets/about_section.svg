<svg width="100%" height="auto" viewBox="0 0 900 580" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow2" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="50%" stop-color="#140505"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>

    <linearGradient id="titleShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2b2b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff9a6a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff2b2b" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bubbleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>

    <clipPath id="rounded2">
      <rect x="0" y="0" width="900" height="580" rx="20" ry="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded2)">
    <rect x="0" y="0" width="900" height="580" fill="url(#bgGlow2)"/>

    <!-- floating rising bubbles -->
    <g>
      <circle cx="60" cy="560" r="6" fill="none" stroke="#ff4d4d" stroke-width="1.5" opacity="0.5">
        <animate attributeName="cy" values="560;-30" dur="9s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="60;90;60" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="9s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="830" cy="560" r="9" fill="none" stroke="#ff8080" stroke-width="1.5" opacity="0.4">
        <animate attributeName="cy" values="560;-30" dur="11s" begin="2s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="830;800;830" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="11s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="450" cy="570" r="5" fill="none" stroke="#ff5a3a" stroke-width="1.5" opacity="0.45">
        <animate attributeName="cy" values="570;-30" dur="8s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="450;480;450" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="700" cy="565" r="7" fill="none" stroke="#ff6a4a" stroke-width="1.5" opacity="0.4">
        <animate attributeName="cy" values="565;-30" dur="10s" begin="3.5s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="700;670;700" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="10s" begin="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" cy="560" r="4" fill="none" stroke="#ff9a6a" stroke-width="1.5" opacity="0.45">
        <animate attributeName="cy" values="560;-30" dur="7s" begin="2.8s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="200;230;200" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.6;0" dur="7s" begin="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- title pill -->
    <g transform="translate(450,55)">
      <rect x="-330" y="-28" width="660" height="56" rx="28" ry="28" fill="#1a0505" stroke="#7a1010" stroke-width="1.5">
        <animate attributeName="stroke" values="#7a1010;#ff2b2b;#7a1010" dur="2.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="-330" y="-28" width="660" height="56" rx="28" ry="28" fill="url(#titleShimmer)" opacity="0.5"/>
      <text x="0" y="8" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-weight="bold" font-size="24" fill="#ff4a2f" filter="url(#glow2)" letter-spacing="1">
        SPELL SCROLL OF THE DEMON ARCHITECT
      </text>
    </g>

    <!-- intro bubble -->
    <g transform="translate(450,165)">
      <rect x="-410" y="-55" width="820" height="110" rx="26" ry="26" fill="#12181f" stroke="#3a1414" stroke-width="1.5" opacity="0.9">
        <animate attributeName="stroke" values="#3a1414;#ff2b2b;#3a1414" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="0" y="-18" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="16.5" fill="#e6e6e6">
        <tspan x="0" dy="0">Greetings, traveler of the digital abyssal realm. I am <tspan font-weight="bold" fill="#ffffff">Sumit Kumar</tspan>, a Full-Stack Engineer</tspan>
        <tspan x="0" dy="26">&amp; Code Sorcerer crafting high-performance, resilient microservices and immersive</tspan>
        <tspan x="0" dy="26">dark-mode web experiences.</tspan>
      </text>
    </g>

    <!-- stat bubbles grid -->
    <g font-family="Verdana, Geneva, sans-serif">

      <!-- bubble template repeated with transforms -->
      <g transform="translate(230,290)">
        <animateTransform attributeName="transform" type="translate" values="230,290;230,282;230,290" dur="3.6s" repeatCount="indefinite" additive="replace"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#14090a" stroke="#7a1010" stroke-width="1.4" filter="url(#bubbleGlow)" opacity="0.25"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#150a0b" stroke="#8a2020" stroke-width="1.3">
          <animate attributeName="stroke" values="#8a2020;#ff3b3b;#8a2020" dur="3.2s" repeatCount="indefinite"/>
        </rect>
        <text x="-180" y="-10" font-size="22">&#128081;</text>
        <text x="-145" y="-8" font-size="14.5" fill="#ffffff"><tspan font-weight="bold" fill="#ff8a5a">Current Role: </tspan><tspan fill="#e6e6e6">Senior Full-Stack</tspan></text>
        <text x="-145" y="16" font-size="14.5" fill="#e6e6e6">Engineer</text>
      </g>

      <g transform="translate(670,290)">
        <animateTransform attributeName="transform" type="translate" values="670,290;670,282;670,290" dur="3.9s" begin="0.4s" repeatCount="indefinite" additive="replace"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#14090a" stroke="#7a1010" stroke-width="1.4" filter="url(#bubbleGlow)" opacity="0.25"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#150a0b" stroke="#8a2020" stroke-width="1.3">
          <animate attributeName="stroke" values="#8a2020;#ff3b3b;#8a2020" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
        </rect>
        <text x="-180" y="-10" font-size="22">&#128293;</text>
        <text x="-145" y="-8" font-size="14.5" fill="#ffffff"><tspan font-weight="bold" fill="#ff8a5a">Main Domain: </tspan><tspan fill="#e6e6e6">Node.js, React,</tspan></text>
        <text x="-145" y="16" font-size="14.5" fill="#e6e6e6">TypeScript, Cloud Native</text>
      </g>

      <g transform="translate(230,390)">
        <animateTransform attributeName="transform" type="translate" values="230,390;230,382;230,390" dur="3.4s" begin="0.8s" repeatCount="indefinite" additive="replace"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#14090a" stroke="#7a1010" stroke-width="1.4" filter="url(#bubbleGlow)" opacity="0.25"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#150a0b" stroke="#8a2020" stroke-width="1.3">
          <animate attributeName="stroke" values="#8a2020;#ff3b3b;#8a2020" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
        </rect>
        <text x="-180" y="-10" font-size="22">&#128214;</text>
        <text x="-145" y="-8" font-size="14.5" fill="#ffffff"><tspan font-weight="bold" fill="#ff8a5a">Grimoire: </tspan><tspan fill="#e6e6e6">Rust, WebAssembly</tspan></text>
        <text x="-145" y="16" font-size="14.5" fill="#e6e6e6">&amp; High-Scale Systems</text>
      </g>

      <g transform="translate(670,390)">
        <animateTransform attributeName="transform" type="translate" values="670,390;670,382;670,390" dur="3.7s" begin="1.2s" repeatCount="indefinite" additive="replace"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#14090a" stroke="#7a1010" stroke-width="1.4" filter="url(#bubbleGlow)" opacity="0.25"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#150a0b" stroke="#8a2020" stroke-width="1.3">
          <animate attributeName="stroke" values="#8a2020;#ff3b3b;#8a2020" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
        </rect>
        <text x="-180" y="-10" font-size="22">&#127769;</text>
        <text x="-145" y="-8" font-size="14.5" fill="#ffffff"><tspan font-weight="bold" fill="#ff8a5a">Cursed Fact: </tspan><tspan fill="#e6e6e6">Code compiles first</tspan></text>
        <text x="-145" y="16" font-size="14.5" fill="#e6e6e6">try under a full moon</text>
      </g>

      <g transform="translate(230,490)">
        <animateTransform attributeName="transform" type="translate" values="230,490;230,482;230,490" dur="4.1s" begin="1.6s" repeatCount="indefinite" additive="replace"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#14090a" stroke="#7a1010" stroke-width="1.4" filter="url(#bubbleGlow)" opacity="0.25"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#150a0b" stroke="#8a2020" stroke-width="1.3">
          <animate attributeName="stroke" values="#8a2020;#ff3b3b;#8a2020" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
        </rect>
        <text x="-180" y="-10" font-size="22">&#129497;</text>
        <text x="-145" y="-8" font-size="14.5" fill="#ffffff"><tspan font-weight="bold" fill="#ff8a5a">Summoning: </tspan><tspan fill="#e6e6e6">Open for high-impact</tspan></text>
        <text x="-145" y="16" font-size="14.5" fill="#e6e6e6">backend &amp; full-stack roles</text>
      </g>

      <g transform="translate(670,490)">
        <animateTransform attributeName="transform" type="translate" values="670,490;670,482;670,490" dur="3.5s" begin="2s" repeatCount="indefinite" additive="replace"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#14090a" stroke="#7a1010" stroke-width="1.4" filter="url(#bubbleGlow)" opacity="0.25"/>
        <rect x="-205" y="-42" width="410" height="84" rx="24" ry="24" fill="#150a0b" stroke="#8a2020" stroke-width="1.3">
          <animate attributeName="stroke" values="#8a2020;#ff3b3b;#8a2020" dur="3.2s" begin="2s" repeatCount="indefinite"/>
        </rect>
        <text x="-180" y="-10" font-size="22">&#9889;</text>
        <text x="-145" y="-8" font-size="14.5" fill="#ffffff"><tspan font-weight="bold" fill="#ff8a5a">Power Level: </tspan><tspan fill="#e6e6e6">Turning caffeine</tspan></text>
        <text x="-145" y="16" font-size="14.5" fill="#e6e6e6">into 10x throughput</text>
      </g>

    </g>

    <!-- outer border glow -->
    <rect x="4" y="4" width="892" height="572" rx="18" ry="18" fill="none" stroke="#ff2b2b" stroke-width="2" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
